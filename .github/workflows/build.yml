name: Build WAX206 OpenWrt 256M (custom packages)

# 相对原版 build.yml 的改动，只有四处（都在本文件内，无需改上游源码）：
#   1. 新增 "Resolve package list" 步骤：把 packages.txt 变成 .config 的
#      CONFIG_PACKAGE_* 行，并在 feeds 索引里校验包名是否存在——包名打错时
#      在配置阶段就红，而不是编译 40 分钟后才发现某个包其实是空的。
#   2. config 里用 FEEDS_INSTALL 变量控制 install -a / install <列表>。
#   3. 新增 "Verify enabled packages" 步骤：从 .config 反查实际生效的包，
#      把 "我勾了但被依赖裁剪掉" 的情况打印出来。
#   4. 产物收集时同时输出 *ext4* 与 *squashfs* 两套，flavor 在名字里可辨。

on:
  workflow_dispatch:
    inputs:
      flavors:
        description: '要构建的根文件系统（空格分隔：squashfs ext4）'
        default: 'squashfs ext4'
        required: false
      thirdparty_oaf:
        description: '加入 kenzok8/small-package feed（OAF 界面 luci-app-oaf 在这里）'
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

env:
  OPENWRT_VERSION: v25.12.5
  OPENWRT_DIR: openwrt
  # all = 官方全量 feed（体积大但省事）；list = 只装名单里的包，编译更快
  FEEDS_INSTALL: all

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom build repository
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget xsltproc swig time libelf-dev \
            device-tree-compiler

      - name: Clone official OpenWrt source
        run: |
          git clone --branch "${OPENWRT_VERSION}" --single-branch --depth=1 \
            https://git.openwrt.org/openwrt/openwrt.git "${OPENWRT_DIR}"

      - name: Add third-party feed (OAF)
        if: ${{ inputs.thirdparty_oaf != false }}
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # luci-app-oaf 只在 kenzok8/small-package；它的依赖 appfilter/kmod-oaf
          # 仍在官方 packages feed。只加这一个第三方源即可。
          echo "src-git smallpack https://github.com/kenzok8/small-package.git" \
            >> feeds.conf.default

      - name: Update and install feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # 顺序：update -a（拉全部 feed 源码，同时生成 feeds/<name>.index）
          #       → 先单独装第三方包 → 再 install -a 装官方全量。
          #
          # 为什么第三方包要单独先装：
          #   CI 上出现过一个诡异现象——install -a 跑完后（日志里已经遍历到
          #   video feed 的 weston），package/feeds/smallpack/ 下却没有
          #   luci-app-oaf，紧接着单独 install -p smallpack 又报
          #   "No feed for package"，而 feeds/smallpack.index 其实是好的。
          #   install -a 要遍历 2000+ 个包，smallpack 排在 feeds.conf 最后，
          #   遍历到那里时的状态不稳定。先把它单独装掉最稳。
          #
          # 另一个坑：install 在 index 未就绪时只打印
          #   "WARNING: No feed for package xxx"
          # 但返回码仍是 0，包静默丢失，直到 defconfig 才表现为包不存在。
          ./scripts/feeds update -a

          if [ "${{ inputs.thirdparty_oaf }}" != "false" ]; then
            echo "=== 单独安装第三方包（smallpack）==="
            ./scripts/feeds install -f -p smallpack luci-app-oaf || true
            if [ ! -e package/feeds/smallpack/luci-app-oaf ]; then
              echo "::error::luci-app-oaf 装不上。诊断信息："
              echo "--- feeds.conf.default ---"; cat feeds.conf.default
              echo "--- feeds/smallpack.index ---"; ls -la feeds/smallpack.index || echo "(不存在)"
              echo "--- feeds/smallpack 目录 ---"; ls feeds/smallpack 2>/dev/null | head -5 || echo "(不存在)"
              exit 1
            fi
            echo "✓ package/feeds/smallpack/luci-app-oaf 已就绪"
          fi

          echo "=== 安装官方全量 feed ==="
          ./scripts/feeds install -a

      - name: Apply WAX206 full-NAND layout patch
        run: |
          # 同一份脚本 OpenWrt / ImmortalWrt 通用（自动识别源码类型）。
          # 默认 full = 吃满 NAND；想沿用原来的 178MiB 就改成 --size 178m。
          # --ext4 让 target 的 FILESYSTEMS 加上 ext4，否则即使开了
          # CONFIG_TARGET_ROOTFS_EXT4FS，Device/Build 也不会产出 ext4 镜像。
          python3 scripts/patch-wax206-full256.py "${OPENWRT_DIR}" --size full --ext4

      - name: Verify patched DTS structure
        run: |
          # 补丁只改 DTS 文本，这里做结构校验（括号/孤立分号/残留分区/尺寸）
          python3 scripts/check-dts.py \
            "${OPENWRT_DIR}/target/linux/mediatek/dts/mt7622-netgear-wax206.dts"

      - name: Resolve package list into .config
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cp ../config/wax206-25.12.5.config .config

          # LuCI 语言包的 Default 是 LUCI_LANG_zh_Hans||(ALL&&m)，
          # 不开这个开关它们只会是 =m，而目标镜像不出 m 包 → 中文界面消失
          echo 'CONFIG_LUCI_LANG_zh_Hans=y' >> .config

          # ---- 把 packages.txt 逐行翻成 CONFIG_PACKAGE_<name>=y ----
          # 支持行内注释与空行；带 "=n" 的行原样透传，用来显式关掉某个包。
          echo '### 追加的软件包选择' >> .config
          while IFS= read -r line; do
            pkg="$(echo "$line" | sed -e 's/#.*//' -e 's/[[:space:]]//g')"
            [ -z "$pkg" ] && continue
            case "$pkg" in
              *=y|*=n|*=m) echo "CONFIG_PACKAGE_${pkg%%=*}=${pkg#*=}" >> .config ;;
              *)           echo "CONFIG_PACKAGE_${pkg}=y" >> .config ;;
            esac
          done < ../packages.txt

          # ---- 校验：包名必须能在某个 feed index 里找到 ----
          missing=0
          while IFS= read -r line; do
            pkg="$(echo "$line" | sed -e 's/#.*//' -e 's/[[:space:]]//g' -e 's/=.*//')"
            [ -z "$pkg" ] && continue
            if ! grep -qx "Package: ${pkg}" feeds/*.index; then
              echo "::error::packages.txt 里的 ${pkg} 不在任何官方 feed 中（拼写错误或需要自定义 feed）"
              missing=1
            fi
          done < ../packages.txt
          test "${missing}" -eq 0

          make defconfig

      - name: Show effective filesystem flavors
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          for o in TARGET_ROOTFS_SQUASHFS TARGET_ROOTFS_EXT4FS USE_APK TARGET_ROOTFS_PARTSIZE; do
            printf '%-28s %s\n' "$o" "$(grep -E "^CONFIG_${o}=" .config || echo '(未设置)')"
          done
          echo '=== 期望在产物里看到 squashfs 与 ext4 两种 sysupgrade ==='

      - name: Verify enabled packages
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          echo '=== packages.txt 中实际生效的包 ==='
          fail=0
          while IFS= read -r line; do
            pkg="$(echo "$line" | sed -e 's/#.*//' -e 's/[[:space:]]//g' -e 's/=.*//')"
            [ -z "$pkg" ] && continue
            if grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then
              printf '  OK      %s\n' "$pkg"
            else
              # 被 not set 说明依赖不满足而被裁掉，必须让构建失败
              printf '  ::error:: %s 没有生效\n' "$pkg"
              fail=1
            fi
          done < ../packages.txt
          echo "=== 固件内包数量：$(grep -c '^CONFIG_PACKAGE_.*=y$' .config) ==="
          test "${fail}" -eq 0

      - name: Compile firmware
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make -j"$(nproc)" V=s

      - name: Verify generated WAX206 DTB
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          DTB="$(find build_dir -type f -name 'image-mt7622-netgear-wax206.dtb' | head -n1)"
          test -n "${DTB}"
          echo "DTB=${DTB}"
          dtc -I dtb -O dts -o /tmp/wax206.dts "${DTB}"
          grep -n -A18 -B2 'partition@2c0000' /tmp/wax206.dts
          ! grep -q 'partition@28c0000' /tmp/wax206.dts

      - name: Collect and checksum artifacts
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          mkdir -p ../release
          find bin/targets/mediatek/mt7622 -maxdepth 1 -type f \
            \( -name '*netgear_wax206*' -o -name '*wax206*' \) \
            -exec cp {} ../release/ \;
          cd ../release
          ls -lh
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wax206-openwrt-25.12.5-full256-custom
          path: release/
          if-no-files-found: error
