name: Build WAX206 ImmortalWrt 25.12 扩展分区

# 完全走 ImmortalWrt 官方编译流程（和 firmware-selector 背后的构建同源）：
#   clone immortalwrt → feeds update/install → 打扩展分区补丁 → defconfig → make
# 与 OpenWrt 版 build.yml 的区别：源码换 immortalwrt.git，补丁换
# patch-wax206-full256.py（能吃满 253MiB，OpenWrt 版只到 178MiB）。

on:
  workflow_dispatch:
    inputs:
      fw_size:
        description: 'firmware 分区尺寸：full（吃满 253MiB）或 178m 之类的 MiB 值'
        default: 'full'
        required: false
      build_ext4:
        description: '同时构建 ext4 根（根可写，真正用满 UBI）'
        type: boolean
        default: true
      thirdparty_oaf:
        description: '加入 kenzok8/small-package feed（OAF 界面 luci-app-oaf 在这里）'
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMMORTALWRT_BRANCH: openwrt-25.12
  OPENWRT_DIR: immortalwrt
  FEEDS_INSTALL: all

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget xsltproc swig time libelf-dev \
            device-tree-compiler

      - name: Clone ImmortalWrt source
        run: |
          git clone --branch "${IMMORTALWRT_BRANCH}" --single-branch --depth=1 \
            https://github.com/immortalwrt/immortalwrt.git "${OPENWRT_DIR}"
          cd "${OPENWRT_DIR}"
          echo "=== 源码版本 ==="
          git log --oneline -1
          grep -E 'VERSION_NUMBER|VERSION_REPO' include/version.mk | head -3

      - name: Add third-party feed (OAF)
        if: ${{ inputs.thirdparty_oaf != false }}
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # luci-app-oaf 不在任何官方 feed，只在 kenzok8/small-package。
          # 但它的依赖 appfilter / kmod-oaf 在官方 packages feed 里，
          # 所以只需要这一个第三方源，而且只 sparse 检出 oaf 目录
          # ——整个仓库 1.7 万个文件，全拉会撑爆 runner 磁盘。
          echo "src-git smallpack https://github.com/kenzok8/small-package.git" \
            >> feeds.conf.default

      - name: Update and install feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # 顺序：update -a（拉源码+生成 feeds/<name>.index）→ install -a。
          # 踩过的坑：index 没就绪时 install 只打印
          #   "WARNING: No feed for package xxx"
          # 但返回码仍是 0，包静默丢失，直到 defconfig 才表现为包不存在。
          ./scripts/feeds update -a

          # 第三方包单独先装（原因见 build.yml 里的同一段注释：
          # install -a 遍历 2000+ 包时，排在末尾的 third-party feed 状态不稳）
          if [ "${{ inputs.thirdparty_oaf }}" != "false" ]; then
            echo "=== 单独安装第三方包（smallpack）==="
            ./scripts/feeds install -f -p smallpack luci-app-oaf || true
            if [ ! -e package/feeds/smallpack/luci-app-oaf ]; then
              echo "::error::luci-app-oaf 装不上。诊断信息："
              echo "--- feeds.conf.default ---"; cat feeds.conf.default
              echo "--- feeds/smallpack.index ---"; ls -la feeds/smallpack.index || echo "(不存在)"
              echo "--- feeds/smallpack 目录 ---"; ls feeds/smallpack 2>/dev/null | head -5 || echo "(不存在)"
              exit 1
            fi
            echo "✓ package/feeds/smallpack/luci-app-oaf 已就绪"
          fi

          echo "=== 安装官方全量 feed ==="
          ./scripts/feeds install -a

      - name: Apply extended-partition patch
        run: |
          # --ext4 会把 target 的 FILESYSTEMS 加上 ext4（否则只出 squashfs）
          EXTRA=""
          if [ "${{ inputs.build_ext4 }}" = "true" ]; then EXTRA="--ext4"; fi
          python3 scripts/patch-wax206-full256.py "${OPENWRT_DIR}" \
            --size "${{ inputs.fw_size || 'full' }}" ${EXTRA}

      - name: Verify patched DTS structure
        run: |
          python3 scripts/check-dts.py \
            "${OPENWRT_DIR}/target/linux/mediatek/dts/mt7622-netgear-wax206.dts"

      - name: Resolve package list into .config
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cp ../config/wax206-immortalwrt.config .config

          # LuCI 语言包 Default 是 LUCI_LANG_zh_Hans||(ALL&&m)，不开这个开关
          # 会退化到 =m，而镜像不出 m 包 → 中文界面消失（实测复现）
          echo 'CONFIG_LUCI_LANG_zh_Hans=y' >> .config

          echo '### 追加的软件包选择' >> .config
          while IFS= read -r line; do
            pkg="$(echo "$line" | sed -e 's/#.*//' -e 's/[[:space:]]//g')"
            [ -z "$pkg" ] && continue
            case "$pkg" in
              *=y|*=n|*=m) echo "CONFIG_PACKAGE_${pkg%%=*}=${pkg#*=}" >> .config ;;
              *)           echo "CONFIG_PACKAGE_${pkg}=y" >> .config ;;
            esac
          done < ../packages.txt

          missing=0
          while IFS= read -r line; do
            pkg="$(echo "$line" | sed -e 's/#.*//' -e 's/[[:space:]]//g' -e 's/=.*//')"
            [ -z "$pkg" ] && continue
            if ! grep -qx "Package: ${pkg}" feeds/*.index; then
              echo "::error::${pkg} 不在任何 feed 索引中（拼写错误，或对应 feed 没加上）"
              missing=1
            fi
          done < ../packages.txt
          test "${missing}" -eq 0

          make defconfig

      - name: Show effective configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          for o in TARGET_ROOTFS_SQUASHFS TARGET_ROOTFS_EXT4FS TARGET_ROOTFS_PARTSIZE USE_APK; do
            printf '%-30s %s\n' "$o" "$(grep -E "^CONFIG_${o}=" .config || echo '(未设置)')"
          done
          echo '=== WAX206 设备镜像参数 ==='
          sed -n '/define Device\/netgear_wax206/,/endef/p' \
            target/linux/mediatek/image/mt7622.mk | grep -E 'KERNEL_SIZE|IMAGE_SIZE'
          echo '=== target FILESYSTEMS ==='
          grep -E '^\s*FILESYSTEMS' target/linux/mediatek/image/Makefile

      - name: Verify enabled packages
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          fail=0
          while IFS= read -r line; do
            pkg="$(echo "$line" | sed -e 's/#.*//' -e 's/[[:space:]]//g' -e 's/=.*//')"
            [ -z "$pkg" ] && continue
            if grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then
              printf '  OK      %s\n' "$pkg"
            else
              printf '  ::error:: %s 没有生效\n' "$pkg"
              fail=1
            fi
          done < ../packages.txt
          echo "包总数: $(grep -c '^CONFIG_PACKAGE_.*=y$' .config)"
          test "${fail}" -eq 0

      - name: Compile firmware
        working-directory: ${{ env.OPENWRT_DIR }}
        run: make -j"$(nproc)" V=s

      - name: Verify generated DTB partition layout
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          DTB="$(find build_dir -type f -name 'image-mt7622-netgear-wax206.dtb' | head -n1)"
          test -n "${DTB}"
          echo "DTB=${DTB}"
          dtc -I dtb -O dts -o /tmp/wax206.dts "${DTB}"

          echo '=== 编译出的 DTB 里的分区 ==='
          grep -A3 'label = "firmware"' /tmp/wax206.dts | head -6

          # 硬性断言：老的 38MiB 布局和厂商分区必须都不在了
          ! grep -q 'partition@28c0000' /tmp/wax206.dts \
            || { echo "::error::firmware_backup 仍存在，分区表没改成功"; exit 1; }
          ! grep -q 'label = "User_data"' /tmp/wax206.dts \
            || { echo "::error::User_data 仍存在"; exit 1; }

      - name: Collect artifacts
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          mkdir -p ../release
          find bin/targets/mediatek/mt7622 -maxdepth 1 -type f \
            \( -name '*netgear_wax206*' -o -name '*wax206*' \) \
            -exec cp {} ../release/ \;
          cd ../release
          ls -lh
          echo '=== 期望看到 squashfs 与 ext4 两种 sysupgrade ==='
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wax206-immortalwrt-25.12-extpart-${{ inputs.fw_size || 'full' }}
          path: release/
          if-no-files-found: error
